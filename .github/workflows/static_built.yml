name: Stats Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    if: github.repository == 'RobertoDiazEc/link_bio'
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install uv
        run: pip install uv

      - name: Create env file
        run: |
          cat << EOF > .env
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            ROUTEANEXO2=${{ secrets.ROUTEANEXO2 }}
            ROUTEAPI_PDF=${{ secrets.ROUTEAPI_PDF }}
          EOF  

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Export frontend
        run: |
            API_URL=https://api.cpkm.com.co uv run reflex export --frontend-only
            rm -rf public
            unzip frontend.zip -d public
            rm -f  frontend.zip

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update static build
          commit_user_name: RobertoDiazEc [github action]
          commit_user_email: robertodiazec@gmail.com
          commit_author: robertodiaz
